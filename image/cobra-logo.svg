<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cobra head -->
  <circle cx="50" cy="40" r="28" fill="#00ff66"/>
  <!-- Cobra hood -->
  <ellipse cx="50" cy="35" rx="35" ry="32" fill="none" stroke="#00ff66" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="42" cy="35" r="4" fill="#050505"/>
  <circle cx="58" cy="35" r="4" fill="#050505"/>
  <!-- Fangs -->
  <polygon points="50,50 48,55 50,54 52,55" fill="#fff"/>
  <!-- Body curve -->
  <path d="M 50 68 Q 35 80 40 95" stroke="#00ff66" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 50 68 Q 65 80 60 95" stroke="#00ff66" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>